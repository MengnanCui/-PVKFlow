[project]
name = "hte-studio"
version = "0.1.0"
description = "HTE Studio —— 高通量实验数据平台：数据处理 / 数据存储 / 构效关系"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
