# 每次推送都跑一遍。三件事：
#   lint     —— ruff，只开抓 bug 的规则（见 pyproject.toml）
#   test     —— pytest，Linux 两个 Python 版本 + Windows 支持范围的两头。
#               Windows 上**故意不设 PYTHONUTF8**：同事双击 run.bat 时也没有它，
#               编码类的毛病要在这里先露出来
#   startup  —— 真的跑一遍 run.bat（Windows）和 run.sh（Linux）：建虚拟环境、装依赖、
#               起服务，然后打健康检查和首页。run.bat 在此之前从没在任何地方跑过。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.4
      - run: ruff check app tests tools

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          # Windows 上测支持范围的两头（3.11 和 3.15，见 requirements.txt 开头）。
          # 同事从 python.org 下的多半是最新版 —— 依赖在最新版上有没有预编译包，要在这里先知道
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.15" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      # 算子一致性测试要用 node 跑 web/js/ops.js；前端打包检查也要它
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 和 run.bat 一样只装预编译包：哪个依赖在这个 Python 上没有 wheel，这一步就红
      # 整条加引号：结尾的 `:all:` 不加引号会被 YAML 当成「键:」，整个工作流文件就解析失败
      - run: "python -m pip install -r requirements-dev.txt --only-binary=:all:"
      - run: python -m pytest -q

  startup-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 双击 run.bat 的等价操作
        shell: pwsh
        timeout-minutes: 12
        run: |
          $env:HTE_NO_BROWSER = "1"
          $env:HTE_WORKSPACE = "$env:RUNNER_TEMP\hte-ws"
          # stdin 接 NUL：run.bat 出错时会 pause 等按键，CI 里没有人按 —— 不接的话就一直卡着
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'run.bat < NUL' -PassThru `
                 -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          try {
            $deadline = (Get-Date).AddMinutes(8)
            $ok = $false
            while ((Get-Date) -lt $deadline) {
              if ($p.HasExited) { throw "run.bat 自己退出了（退出码 $($p.ExitCode)），没起服务" }
              try {
                $r = Invoke-RestMethod -Uri http://127.0.0.1:8765/api/health -TimeoutSec 3
                if ($r.ok) { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 3
            }
            if (-not $ok) { throw "run.bat 8 分钟内没有起来" }
            Write-Host "健康检查：$($r | ConvertTo-Json -Compress)"
            $page = Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing
            if ($page.Content -notmatch 'HTE Studio') { throw "首页不对" }
            $js = Invoke-WebRequest -Uri http://127.0.0.1:8765/assets/js/app.js -UseBasicParsing
            if ($js.StatusCode -ne 200) { throw "前端脚本取不到" }
            Write-Host "run.bat：建环境、装依赖、起服务、首页 —— 全部通过"
          } finally {
            # 服务是 cmd → python 的子进程，连根拔掉；不然它占着输出管道，这一步永远结束不了
            Get-CimInstance Win32_Process |
              Where-Object { $_.CommandLine -like '*app.main*' } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            taskkill /PID $p.Id /T /F 2>$null | Out-Null
            # 上面 Stop-Process 已经把服务连带 cmd 拔掉了，taskkill 找不到进程会返回非零；
            # Actions 的 pwsh 外壳拿「最后一个外部命令的退出码」当这一步的结果 —— 不清零的话，
            # 全部通过也会被标成失败（第 4 次运行就是这样）。真出错时上面的 throw 照样让这一步失败
            $global:LASTEXITCODE = 0
          }
      - name: run.bat 的输出
        if: always()
        shell: pwsh
        run: |
          Write-Host "---- stdout ----"; Get-Content out.txt -ErrorAction SilentlyContinue
          Write-Host "---- stderr ----"; Get-Content err.txt -ErrorAction SilentlyContinue

  startup-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run.sh
        run: |
          export HTE_NO_BROWSER=1 HTE_WORKSPACE="$RUNNER_TEMP/hte-ws"
          ./run.sh > out.txt 2>&1 &
          for i in $(seq 1 150); do
            if curl -sf http://127.0.0.1:8765/api/health; then ok=1; break; fi
            sleep 2
          done
          cat out.txt
          [ "${ok:-}" = 1 ] || { echo "run.sh 5 分钟内没有起来"; exit 1; }
          curl -sf http://127.0.0.1:8765/ | grep -q 'HTE Studio'
          echo "run.sh：建环境、装依赖、起服务、首页 —— 全部通过"
